build:
  environment:
    php: '8.2'
  nodes:
    analysis:
      project_setup:
        override: true
      tests:
        override:
          - php-scrutinizer-run
          - phpcs-run
    coverage:
      tests:
        override:
          - command: vendor/bin/phpunit --coverage-clover coverage.xml
            coverage:
              file: coverage.xml
              format: php-clover

checks:
  php:
    code_rating: true
    duplication: true

filter:
  excluded_paths:
    - tests/*
    - vendor/*
    - js/vendor/*