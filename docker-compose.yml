version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: adminoffboard_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    container_name: adminoffboard_redis
    restart: always
    ports:
      - "6379:6379"

  nextcloud:
    build: .
    container_name: adminoffboard_nextcloud
    restart: always
    depends_on:
      - db
      - redis
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin123
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nextcloud_data:/var/www/html/data
      - ./:/var/www/html/apps/adminoffboard
    ports:
      - "8080:80"

volumes:
  db_data:
  nextcloud_data: